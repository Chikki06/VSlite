runner: "BBDMRunner"
training:
  n_epochs: 50
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'vslite_vs'
  dataset_type: 'vslite_vs_npy'
  dataset_config:
    dataroot: '/projects/illinois/eng/bioe/rxb/akshat/VSlite/dataset/data_frozen'
    input_nc: 13
    num_ir_channels: 10
    image_size: 256
    channels: 3
    to_normal: True
    flip: False
  train:
    batch_size: 8
    shuffle: True
  val:
    batch_size: 8
    shuffle: True
  test:
    batch_size: 1

model:
  model_name: "LBBDM-vslite-vqganpytorch-convnext-13"
  model_type: "LBBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  CondStageParams:
    tcga_feature_ckpt: '/projects/illinois/eng/bioe/rxb/akshat/VSlite/tcga_tl_checkpoints/convnext_feature.pt'
    n_stages: 2
    in_channels: 3
    out_channels: 3

  VQGAN:
    params:
      vqgan_impl: 'vqgan_pytorch'
      vqgan_pytorch_ckpt: '/projects/illinois/eng/bioe/rxb/akshat/VSlite/results/vqgan/vqgan_he/checkpoints/vqgan_epoch_049.pt'

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 64
        in_channels: 3
        model_channels: 128
        out_channels: 3
        num_res_blocks: 2
        attention_resolutions: !!python/tuple [32, 16, 8]
        channel_mult: !!python/tuple [1, 4, 8]
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: True
        context_dim: 256
        condition_key: "nocond"

